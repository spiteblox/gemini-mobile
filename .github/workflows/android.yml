name: Build Gemini Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx cap add android

      - name: Generate Gemini launcher icons
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/gemini-logo.svg

          RES=android/app/src/main/res
          mkdir -p "$RES/drawable-nodpi"
          mkdir -p "$RES/mipmap-anydpi-v26"

          rsvg-convert -w 432 -h 432 \
            assets/gemini-logo.svg \
            -o "$RES/drawable-nodpi/ic_launcher_foreground.png"

          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="${spec%%:*}"
            size="${spec##*:}"
            mkdir -p "$RES/mipmap-$density"

            rsvg-convert -w "$size" -h "$size" \
              assets/gemini-logo.svg \
              -o "$RES/mipmap-$density/ic_launcher.png"

            cp "$RES/mipmap-$density/ic_launcher.png" \
               "$RES/mipmap-$density/ic_launcher_round.png"
          done

          cat > "$RES/values/ic_launcher_background.xml" <<'XML'
          <resources>
              <color name="ic_launcher_background">#131314</color>
          </resources>
          XML

          for name in ic_launcher ic_launcher_round; do
            cat > "$RES/mipmap-anydpi-v26/$name.xml" <<XML
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          XML
          done

      - name: Configure mobile Firefox user agent
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/java/com/summit/geminimobile/MainActivity.java")
          if not p.exists():
              matches = list(Path("android/app/src/main/java").rglob("MainActivity.java"))
              if len(matches) != 1:
                  raise SystemExit("Could not identify MainActivity.java")
              p = matches[0]

          s = p.read_text()
          if "setUserAgentString" not in s:
              s = s.replace(
                  "import com.getcapacitor.BridgeActivity;",
                  "import com.getcapacitor.BridgeActivity;\n"
                  "import android.os.Bundle;"
              )
              s = s.replace(
                  "public class MainActivity extends BridgeActivity {}",
                  """public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getBridge().getWebView().getSettings().setUserAgentString(
                      "Mozilla/5.0 (Android 11; Mobile; rv:128.0) Gecko/128.0 Firefox/128.0"
                  );
              }
          }"""
              )
          p.write_text(s)
          PY

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Gemini-Mobile-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
