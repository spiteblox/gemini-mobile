name: Build Gemini Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Add Android platform
        run: npx cap add android

      - name: Configure mobile Firefox-style user agent
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/java/com/summit/geminimobile/MainActivity.java")
          s = p.read_text()
          s = s.replace(
              "import com.getcapacitor.BridgeActivity;",
              "import com.getcapacitor.BridgeActivity;\n"
              "import android.os.Bundle;"
          )
          s = s.replace(
              "public class MainActivity extends BridgeActivity {}",
              """public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getBridge().getWebView().getSettings().setUserAgentString(
                      "Mozilla/5.0 (Android 11; Mobile; rv:128.0) Gecko/128.0 Firefox/128.0"
                  );
              }
          }"""
          )
          p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gemini-Mobile-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
